<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM | Novo Cadastro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #16a34a; --bg: #f1f5f9; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 650px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 2.5rem; color: var(--primary); }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .full-width { grid-column: span 2; }
        
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #475569; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 12px; color: #94a3b8; }
        input { box-sizing: border-box; width: 100%; padding: 12px 12px 12px 40px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1); }
        
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #f8fafc; color: #64748b; border: 1.5px solid var(--border); }
        
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 8px; font-weight: 600; text-align: center; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fas fa-id-card"></i>
        <h2>Novo Cliente</h2>
        <p>Preencha os dados de identificação e contato</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/cadastrar">
        <div class="form-group full-width">
            <label>Nome Completo / Razão Social *</label>
            <div class="input-box">
                <i class="fas fa-user"></i>
                <input type="text" name="nome" placeholder="Digite o nome completo" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>CPF *</label>
                <div class="input-box">
                    <i class="fas fa-address-card"></i>
                    <input type="text" name="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required>
                </div>
            </div>
            <div class="form-group">
                <label>CNPJ *</label>
                <div class="input-box">
                    <i class="fas fa-building"></i>
                    <input type="text" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascaraCNPJ(this)" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Telefone *</label>
                <div class="input-box">
                    <i class="fas fa-phone"></i>
                    <input type="text" name="telefone" placeholder="(11) 99999-9999" maxlength="15" oninput="mascaraTelefone(this)" required>
                </div>
            </div>
            <div class="form-group">
                <label>E-mail *</label>
                <div class="input-box">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="cliente@exemplo.com" required>
                </div>
            </div>
        </div>

        <div class="form-group" style="max-width: 50%;">
            <label>CEP *</label>
            <div class="input-box">
                <i class="fas fa-map-marker-alt"></i>
                <input type="text" name="cep" placeholder="00000-000" maxlength="9" oninput="mascaraCEP(this)" required>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-save">
                <i class="fas fa-check"></i> Finalizar Cadastro
            </button>
            <a href="{{ url_for('cliente.listar_clientes') }}" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

<script>
    function mascaraCPF(input) {
        let v = input.value.replace(/\D/g, ""); 
        v = v.replace(/(\d{3})(\d)/, "$1.$2"); 
        v = v.replace(/(\d{3})(\d)/, "$1.$2"); 
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2"); 
        input.value = v;
    }

    function mascaraCNPJ(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/^(\d{2})(\d)/, "$1.$2");
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
        v = v.replace(/\.(\d{3})(\d)/, ".$1/$2"); 
        v = v.replace(/(\d{4})(\d)/, "$1-$2"); 
        input.value = v;
    }

    function mascaraTelefone(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/^(\d{2})(\d)/g, "($1) $2"); 
        v = v.replace(/(\d)(\d{4})$/, "$1-$2"); 
        input.value = v;
    }

    function mascaraCEP(input) {
        let v = input.value.replace(/\D/g, "");
        v = v.replace(/^(\d{5})(\d)/, "$1-$2"); 
        input.value = v;
    }
</script>
</body>
</html>
