<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM | Vincular Serviço</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #16a34a; --bg: #f1f5f9; --text: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .card { background: white; width: 100%; max-width: 550px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .header i { font-size: 2.5rem; color: var(--primary); }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        label { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #475569; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 12px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px 12px 12px 40px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: 0.3s; box-sizing: border-box; font-family: inherit; background-color: white; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1); }
        .btn-group { display: flex; gap: 15px; margin-top: 25px; }
        .btn { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-cancel { background: #f8fafc; color: #64748b; border: 1.5px solid var(--border); }
        .flash-error { background: #fee2e2; color: #991b1b; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <i class="fas fa-clipboard-check"></i>
        <h2>Vincular Serviço Executado</h2>
        <p>Preencha os dados para criar o histórico (US06)</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Selecione o Cliente *</label>
            <div class="input-box">
                <i class="fas fa-user"></i>
                <select name="cliente_id" required>
                    <option value="" disabled selected>Escolha um cliente...</option>
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome }} (CPF: {{ cliente.cpf }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Tipo de Serviço Prestado *</label>
            <div class="input-box">
                <i class="fas fa-screwdriver-wrench"></i>
                <select name="tipo_servico_id" required>
                    <option value="" disabled selected>Escolha o serviço...</option>
                    {% for tipo in tipos %}
                        <option value="{{ tipo.id }}">{{ tipo.nome }} (Validade: {{ tipo.prazo_dias }} dias)</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Data de Realização (Execução) *</label>
            <div class="input-box">
                <i class="fas fa-calendar-alt"></i>
                <input type="date" name="data_execucao" required>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-save">
                <i class="fas fa-save"></i> Registrar Serviço
            </button>
            <a href="{{ url_for('cliente.listar_clientes') }}" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
